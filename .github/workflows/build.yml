name: Build Chill Zone Leaderboards

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle clean build --stacktrace --info --console=plain

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: chill-zone-leaderboards
          path: build/libs/chill-zone-leaderboards-*.jar
